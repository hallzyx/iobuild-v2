server {
    listen 80 default_server;
    server_name iobuild.arroz.dev;

    # API → Monolith direct (cutover) — was gateway:8080, now iobuild-api:8080
    # Handles /api/v1/* via /api/ prefix; watcher/jaeger are no longer proxied here
    location /api/ {
        proxy_pass http://iobuild-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Health — mirrors gateway health, proxied to monolith
    location /health {
        proxy_pass http://iobuild-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — Vue Router
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
